<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 3 - Web Puzzle Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e94560;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #e94560;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
            text-align: center;
            position: relative;
        }

        .level-badge {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #e94560;
        }

        .puzzle-area {
            background: #1a1a2e;
            border: 1px solid #00fff5;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
            position: relative;
        }

        .puzzle-text {
            color: #ffffff;
            font-size: 1.2em;
            line-height: 1.8;
        }

        .secret-emoji {
            cursor: default;
            user-select: none;
        }

        .answer-reveal {
            display: none;
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            color: #1a1a2e;
            padding: 15px 25px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.2em;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .answer-reveal.show {
            display: block;
        }

        .input-area {
            margin-top: 30px;
        }

        .input-area label {
            display: block;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .url-display {
            background: #0a0a15;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            color: #888;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .url-display .editable {
            color: #00fff5;
            border-bottom: 2px dashed #00fff5;
        }

        input[type="text"] {
            width: 200px;
            padding: 12px;
            font-size: 1.1em;
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            border: 2px solid #00fff5;
            border-radius: 5px;
            color: #00fff5;
            text-align: center;
            outline: none;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(0, 255, 245, 0.5);
        }

        .go-btn {
            display: inline-block;
            padding: 12px 30px;
            margin-top: 15px;
            background: linear-gradient(45deg, #00fff5, #00b8b8);
            border: none;
            border-radius: 5px;
            color: #1a1a2e;
            font-size: 1em;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .go-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 245, 0.6);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #666;
            text-decoration: none;
            font-size: 0.9em;
        }

        .back-link:hover {
            color: #e94560;
        }

        .success-badge {
            background: #00ff88;
            color: #1a1a2e;
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: inline-block;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="success-badge">✅ Level 2 Complete!</div>
        <span class="level-badge">LEVEL 3</span>
        <h1><span class="secret-emoji" data-clicks="0">🎯</span> The Hidden Touch</h1>
        
        <div class="puzzle-area">
            <p class="puzzle-text">
                Some secrets require more than just looking.<br><br>
                They require <strong>interaction</strong>.<br><br>
                Click wisely, for not all clicks are equal.
            </p>

            <div class="answer-reveal" id="answerReveal"></div>
        </div>

        <div class="input-area">
            <label>Enter the answer to proceed:</label>
            <div class="url-display">
                https://puzzles.otischan.dev/4<span class="editable">?????</span>.html
            </div>
            <input type="text" id="answer" placeholder="your answer" autocomplete="off">
            <br>
            <button class="go-btn" onclick="checkAnswer()">Go →</button>
        </div>

        <a href="2element.html" class="back-link">← Back to Level 2</a>
    </div>

    <script>
        const _a = [146,139,154,135,142];
        const _k = 34;
        const _d = () => _a.map(n => String.fromCharCode(n - _k)).join('');

        const emoji = document.querySelector('.secret-emoji');
        emoji.addEventListener('click', function() {
            let clicks = parseInt(this.dataset.clicks) + 1;
            this.dataset.clicks = clicks;
            if (clicks >= 3) {
                revealAnswer();
            }
        });

        function revealAnswer() {
            const el = document.getElementById('answerReveal');
            el.innerHTML = '\u{1F389} You found it! The answer is: <strong>' + _d() + '</strong>';
            el.classList.add('show');
        }

        function checkAnswer() {
            const answer = document.getElementById('answer').value.toLowerCase().trim();
            if (answer) {
                window.location.href = '4' + answer + '.html';
            }
        }

        document.getElementById('answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });
    </script>
</body>
</html>
