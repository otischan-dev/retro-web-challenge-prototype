<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 4 - Web Puzzle Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e94560;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #e94560;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
            text-align: center;
        }

        .success-badge {
            background: #00ff88;
            color: #1a1a2e;
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .level-badge {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #e94560;
        }

        .puzzle-area {
            background: #1a1a2e;
            border: 1px solid #00fff5;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
        }

        .puzzle-text {
            color: #ffffff;
            font-size: 1.2em;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .morse-display {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .morse-letter {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .morse-letter .label {
            color: #666;
            font-size: 0.8em;
            margin-bottom: 5px;
        }

        .morse-signals {
            display: flex;
            align-items: center;
            gap: 6px;
            height: 30px;
        }

        .dot {
            width: 14px;
            height: 14px;
            background: #00fff5;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 255, 245, 0.6);
        }

        .dash {
            width: 40px;
            height: 14px;
            background: #00fff5;
            border-radius: 7px;
            box-shadow: 0 0 8px rgba(0, 255, 245, 0.6);
        }

        .morse-divider {
            width: 2px;
            height: 40px;
            background: #333;
            align-self: center;
        }

        .morse-letter:nth-child(1) .dot, .morse-letter:nth-child(1) .dash {
            animation: blink 3s ease-in-out infinite;
        }
        .morse-letter:nth-child(3) .dot, .morse-letter:nth-child(3) .dash {
            animation: blink 3s ease-in-out infinite 0.4s;
        }
        .morse-letter:nth-child(5) .dot, .morse-letter:nth-child(5) .dash {
            animation: blink 3s ease-in-out infinite 0.8s;
        }
        .morse-letter:nth-child(7) .dot, .morse-letter:nth-child(7) .dash {
            animation: blink 3s ease-in-out infinite 1.2s;
        }
        .morse-letter:nth-child(9) .dot, .morse-letter:nth-child(9) .dash {
            animation: blink 3s ease-in-out infinite 1.6s;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .input-area {
            margin-top: 30px;
        }

        .input-area label {
            display: block;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .url-display {
            background: #0a0a15;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            color: #888;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .url-display .editable {
            color: #00fff5;
            border-bottom: 2px dashed #00fff5;
        }

        input[type="text"] {
            width: 200px;
            padding: 12px;
            font-size: 1.1em;
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            border: 2px solid #00fff5;
            border-radius: 5px;
            color: #00fff5;
            text-align: center;
            outline: none;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(0, 255, 245, 0.5);
        }

        .go-btn {
            display: inline-block;
            padding: 12px 30px;
            margin-top: 15px;
            background: linear-gradient(45deg, #00fff5, #00b8b8);
            border: none;
            border-radius: 5px;
            color: #1a1a2e;
            font-size: 1em;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .go-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 245, 0.6);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #666;
            text-decoration: none;
            font-size: 0.9em;
        }

        .back-link:hover {
            color: #e94560;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-badge">✅ Level 3 Complete!</div>
        <span class="level-badge">LEVEL 4</span>
        <h1>📡 The Signal</h1>
        
        <div class="puzzle-area">
            <p class="puzzle-text">
                A strange transmission has been intercepted.<br>
                Can you decode the message?
            </p>

            <div class="morse-display">
                <!-- M: dash dash -->
                <div class="morse-letter">
                    <span class="label">1</span>
                    <div class="morse-signals">
                        <div class="dash"></div>
                        <div class="dash"></div>
                    </div>
                </div>

                <div class="morse-divider"></div>

                <!-- O: dash dash dash -->
                <div class="morse-letter">
                    <span class="label">2</span>
                    <div class="morse-signals">
                        <div class="dash"></div>
                        <div class="dash"></div>
                        <div class="dash"></div>
                    </div>
                </div>

                <div class="morse-divider"></div>

                <!-- R: dot dash dot -->
                <div class="morse-letter">
                    <span class="label">3</span>
                    <div class="morse-signals">
                        <div class="dot"></div>
                        <div class="dash"></div>
                        <div class="dot"></div>
                    </div>
                </div>

                <div class="morse-divider"></div>

                <!-- S: dot dot dot -->
                <div class="morse-letter">
                    <span class="label">4</span>
                    <div class="morse-signals">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>

                <div class="morse-divider"></div>

                <!-- E: dot -->
                <div class="morse-letter">
                    <span class="label">5</span>
                    <div class="morse-signals">
                        <div class="dot"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <label>Enter the decoded word to proceed:</label>
            <div class="url-display">
                https://puzzles.otischan.dev/5<span class="editable">?????</span>.html
            </div>
            <input type="text" id="answer" placeholder="your answer" autocomplete="off">
            <br>
            <button class="go-btn" onclick="checkAnswer()">Go →</button>
        </div>

        <a href="3element.html" class="back-link">← Back to Level 3</a>
    </div>

    <script>
        function checkAnswer() {
            const answer = document.getElementById('answer').value.toLowerCase().trim();
            if (answer) {
                window.location.href = '5' + answer + '.html';
            }
        }

        document.getElementById('answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });
    </script>
</body>
</html>
