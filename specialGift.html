<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜猜禮物 - Gift Guessing Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', 'PingFang TC', 'Microsoft JhengHei', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e94560;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #e94560;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #e94560;
        }

        .subtitle {
            color: #888;
            font-size: 0.95em;
            margin-bottom: 25px;
        }

        .interaction-bar {
            background: #0a0a15;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .guess-counter {
            color: #ffd700;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            width: 200px;
            padding: 12px;
            font-size: 1.1em;
            font-family: 'Courier New', 'Microsoft JhengHei', monospace;
            background: #1a1a2e;
            border: 2px solid #00fff5;
            border-radius: 5px;
            color: #00fff5;
            text-align: center;
            outline: none;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(0, 255, 245, 0.5);
        }

        input[type="text"]::placeholder {
            color: #666;
        }

        .guess-btn {
            padding: 12px 30px;
            background: linear-gradient(45deg, #00fff5, #00b8b8);
            border: none;
            border-radius: 5px;
            color: #1a1a2e;
            font-size: 1.1em;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .guess-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 245, 0.6);
        }

        .guess-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        .puzzle-area {
            background: #1a1a2e;
            border: 1px solid #00fff5;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
            text-align: left;
        }

        .article-title {
            font-size: 1.4em;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        .article-content {
            line-height: 2.2;
            font-size: 1.1em;
        }

        .article-content p {
            margin-bottom: 15px;
        }

        .char-block {
            display: inline-block;
            width: 1.1em;
            height: 1.1em;
            line-height: 1.1em;
            text-align: center;
            margin: 1px;
            vertical-align: middle;
        }

        .masked {
            background: #e94560;
            color: #e94560;
            border-radius: 2px;
        }

        .revealed {
            color: #00ff88;
            border: 1px solid #00ff88;
            border-radius: 2px;
            background: transparent;
        }

        .auto-revealed {
            color: #ffd700;
            border-radius: 2px;
            background: transparent;
        }

        .punctuation {
            color: #ffffff;
        }

        .graveyard {
            background: #0a0a15;
            border: 1px solid #e94560;
            border-radius: 10px;
            padding: 20px;
            margin-top: 25px;
        }

        .graveyard-title {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 1em;
        }

        .graveyard-chars {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
        }

        .wrong-char {
            background: #c44;
            color: white;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 1em;
        }

        .win-message {
            display: none;
            background: linear-gradient(45deg, #00ff88, #00cc6a);
            color: #1a1a2e;
            padding: 25px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.1em;
            line-height: 1.8;
            animation: popIn 0.5s ease;
        }

        .win-message.show {
            display: block;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .game-image {
            max-width: 300px;
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 20px auto;
            display: block;
            border: 2px solid #e94560;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 猜猜禮物</h1>
        <div class="subtitle" style="margin-bottom: 15px;">
            <p>這是一段類似維基百科的描述，你能用最少次數猜出禮物的完整名稱嗎？</p>
            <p style="color: #00fff5; margin-top: 8px; font-weight: bold; font-size: 1.1em;">🎯 目標：猜出標題的所有字</p>
            <p style="color: #ffd700; margin-top: 10px; font-size: 1em;">🎁 第一個估中可以獲得實物</p>
        </div>

        <img src="specialGift.jpg" alt="Gift Guessing Game" class="game-image">

        <div class="interaction-bar">
            <div class="guess-counter">猜測次數: <span id="guessCount">0</span></div>
            <div class="input-group">
                <input type="text" id="guessInput" placeholder="輸入1個字" maxlength="1">
                <button class="guess-btn" id="guessBtn" onclick="makeGuess()">猜</button>
            </div>
        </div>

        <div class="win-message" id="winMessage">
            🏆 恭喜你猜出了標題！ 🏆
            <br><br>
            📸 Please make a screenshot and post in the group to prove you are the first one, then come to next boardgame or my seat to claim the prize.
            <br><br>
            <span style="font-size: 0.85em;">🧩 覺得好玩？可以去挑戰完整 puzzle</span>
            <br>
            <a href="https://puzzles.otischan.dev/" target="_blank" style="color: #1a1a2e; text-decoration: underline; font-size: 0.95em;">puzzles.otischan.dev</a>
        </div>

        <div class="puzzle-area">
            <div class="article-title" id="articleTitle"></div>
            <div class="article-content" id="articleContent"></div>
        </div>

        <div class="graveyard">
            <div class="graveyard-title">❌ 錯誤猜測</div>
            <div class="graveyard-chars" id="graveyardChars"></div>
        </div>

    </div>

          [30043,26086,20896,39678,31351,31976,24081,12331,26173,26086,38610,36565,25926,24160,65334,36931,27496,30028,21739,20023,20719,38792,24162,37011,21554,22354,26095,36980,21028,34934,26220,25960,20879,21312,22983,21295,20881,20675,30034,65334,26398,22282,28900,20896,29586,29347,20030,20847,28457,36301,21661,24657,30382,31477,39678,22848,35306,65334,25213,30814,20144,20701,32155,34949,30025,30034,21739,30382,21093,26537,21402,35979,65334,25146,28900,35419,22852,24222,36671,20196,25403,37026,21151,24889,23609,31192,29331,12331,20174,25605,31192,29331,25152,31722,26127,20318,25205,31192,30382,29147,38314,37026,25841,12332]
        ];
        const _dec = a => a.map(n => String.fromCodePoint(n - _K)).join('');
        const articleData = { title: _dec(_T), paragraphs: _P.map(_dec) };

        // Punctuation that should not be masked
        const punctuation = /[，。、—「」（）：；！？\s\n\r]/;

        let revealedChars = new Set();
        let wrongGuesses = new Set();
        let guessCount = 0;
        let titleChars = new Set();
        let gameWon = false;

        // Extract unique characters from title
        for (let char of articleData.title) {
            if (!punctuation.test(char)) {
                titleChars.add(char);
            }
        }

        function renderText(text, isTitle = false) {
            let html = '';
            for (let char of text) {
                if (punctuation.test(char)) {
                    html += `<span class="punctuation">${char}</span>`;
                } else if (revealedChars.has(char)) {
                    html += `<span class="char-block revealed">${char}</span>`;
                } else if (gameWon) {
                    html += `<span class="char-block auto-revealed">${char}</span>`;
                } else {
                    html += `<span class="char-block masked">█</span>`;
                }
            }
            return html;
        }

        function renderArticle() {
            document.getElementById('articleTitle').innerHTML = renderText(articleData.title, true);
            
            let contentHtml = '';
            for (let para of articleData.paragraphs) {
                contentHtml += `<p>${renderText(para)}</p>`;
            }
            document.getElementById('articleContent').innerHTML = contentHtml;
        }

        function renderGraveyard() {
            const container = document.getElementById('graveyardChars');
            container.innerHTML = '';
            for (let char of wrongGuesses) {
                const span = document.createElement('span');
                span.className = 'wrong-char';
                span.textContent = char;
                container.appendChild(span);
            }
        }

        function checkWin() {
            for (let char of titleChars) {
                if (!revealedChars.has(char)) {
                    return false;
                }
            }
            return true;
        }

        function makeGuess() {
            const input = document.getElementById('guessInput');
            const guess = input.value.trim();
            
            if (guess.length === 0 || guess.length > 1) {
                return;
            }

            guessCount++;
            document.getElementById('guessCount').textContent = guessCount;

            let foundAny = false;
            const fullText = articleData.title + articleData.paragraphs.join('');

            for (let char of guess) {
                if (punctuation.test(char)) {
                    continue;
                }
                
                if (fullText.includes(char)) {
                    revealedChars.add(char);
                    foundAny = true;
                } else {
                    if (!revealedChars.has(char)) {
                        wrongGuesses.add(char);
                    }
                }
            }

            renderArticle();
            renderGraveyard();
            input.value = '';

            if (checkWin()) {
                gameWon = true;
                renderArticle();
                document.getElementById('winMessage').classList.add('show');
                document.getElementById('guessBtn').disabled = true;
                document.getElementById('guessInput').disabled = true;
            }
        }

        // Allow Enter key to submit
        document.getElementById('guessInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                makeGuess();
            }
        });

        // Initial render
        renderArticle();

        // --- DevTools deterrents (non-technical blocker) ---
        // Disable right-click
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Block F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
        document.addEventListener('keydown', function(e) {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
            ) {
                e.preventDefault();
                e.stopPropagation();
            }
        });


    </script>
</body>
</html>
