<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 6 - Web Puzzle Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e94560;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #e94560;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
            text-align: center;
        }

        .success-badge {
            background: #00ff88;
            color: #1a1a2e;
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .level-badge {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #e94560;
        }

        .puzzle-area {
            background: #1a1a2e;
            border: 1px solid #00fff5;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
        }

        .braille-grid {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .braille-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .braille-cell .label {
            color: #666;
            font-size: 0.8em;
            margin-bottom: 5px;
        }

        .braille-char {
            display: grid;
            grid-template-columns: repeat(2, 24px);
            grid-template-rows: repeat(3, 24px);
            gap: 6px;
            padding: 10px;
            background: #0a0a15;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .dot.raised {
            background: #00fff5;
            box-shadow: 0 0 10px rgba(0, 255, 245, 0.6);
        }

        .dot.flat {
            background: #1a1a2e;
            border: 1px solid #333;
        }

        .braille-cell:nth-child(1) .dot.raised { animation: glow 2.5s ease-in-out infinite; }
        .braille-cell:nth-child(3) .dot.raised { animation: glow 2.5s ease-in-out infinite 0.3s; }
        .braille-cell:nth-child(5) .dot.raised { animation: glow 2.5s ease-in-out infinite 0.6s; }
        .braille-cell:nth-child(7) .dot.raised { animation: glow 2.5s ease-in-out infinite 0.9s; }
        .braille-cell:nth-child(9) .dot.raised { animation: glow 2.5s ease-in-out infinite 1.2s; }
        .braille-cell:nth-child(11) .dot.raised { animation: glow 2.5s ease-in-out infinite 1.5s; }
        .braille-cell:nth-child(13) .dot.raised { animation: glow 2.5s ease-in-out infinite 1.8s; }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 10px rgba(0, 255, 245, 0.6); }
            50% { box-shadow: 0 0 20px rgba(0, 255, 245, 0.9), 0 0 30px rgba(0, 255, 245, 0.4); }
        }

        .braille-sep {
            width: 1px;
            height: 90px;
            background: #333;
            align-self: center;
        }

        .input-area {
            margin-top: 30px;
        }

        .input-area label {
            display: block;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .url-display {
            background: #0a0a15;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            color: #888;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .url-display .editable {
            color: #00fff5;
            border-bottom: 2px dashed #00fff5;
        }

        input[type="text"] {
            width: 200px;
            padding: 12px;
            font-size: 1.1em;
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            border: 2px solid #00fff5;
            border-radius: 5px;
            color: #00fff5;
            text-align: center;
            outline: none;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(0, 255, 245, 0.5);
        }

        .go-btn {
            display: inline-block;
            padding: 12px 30px;
            margin-top: 15px;
            background: linear-gradient(45deg, #00fff5, #00b8b8);
            border: none;
            border-radius: 5px;
            color: #1a1a2e;
            font-size: 1em;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .go-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 245, 0.6);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #666;
            text-decoration: none;
            font-size: 0.9em;
        }

        .back-link:hover {
            color: #e94560;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="success-badge">✅ Level 5 Complete!</div>
        <span class="level-badge">LEVEL 6</span>
        <h1>⠃ The Dots</h1>
        
        <div class="puzzle-area">
            <div class="braille-grid" id="brailleGrid"></div>
        </div>

        <div class="input-area">
            <label>Enter the decoded word to proceed:</label>
            <div class="url-display">
                https://puzzles.otischan.dev/7<span class="editable">???????</span>.html
            </div>
            <input type="text" id="answer" placeholder="your answer" autocomplete="off">
            <br>
            <button class="go-btn" onclick="checkAnswer()">Go →</button>
        </div>

        <a href="5morse.html" class="back-link">← Back to Level 5</a>
    </div>

    <script>
        // Braille dot positions (2 columns x 3 rows):
        // Position numbering: 1=top-left, 2=mid-left, 3=bot-left, 4=top-right, 5=mid-right, 6=bot-right
        // B = dots 1,2       -> ⠃
        // R = dots 1,2,3,5   -> ⠗
        // A = dots 1         -> ⠁
        // I = dots 2,4       -> ⠊
        // L = dots 1,2,3     -> ⠇
        // L = dots 1,2,3     -> ⠇
        // E = dots 1,5       -> ⠑
        const brailleWord = [
            [1,1,0,0,0,0], // B: dots 1,2
            [1,1,1,0,1,0], // R: dots 1,2,3,5
            [1,0,0,0,0,0], // A: dot 1
            [0,1,0,1,0,0], // I: dots 2,4
            [1,1,1,0,0,0], // L: dots 1,2,3
            [1,1,1,0,0,0], // L: dots 1,2,3
            [1,0,0,0,1,0]  // E: dots 1,5
        ];

        function createBrailleGrid() {
            const grid = document.getElementById('brailleGrid');
            brailleWord.forEach((dots, idx) => {
                if (idx > 0) {
                    const sep = document.createElement('div');
                    sep.className = 'braille-sep';
                    grid.appendChild(sep);
                }

                const cell = document.createElement('div');
                cell.className = 'braille-cell';

                const label = document.createElement('span');
                label.className = 'label';
                label.textContent = (idx + 1);
                cell.appendChild(label);

                const charGrid = document.createElement('div');
                charGrid.className = 'braille-char';

                // Braille grid layout: columns first (top-left, mid-left, bot-left, top-right, mid-right, bot-right)
                // CSS grid is row-major, so map to:
                // Row 0: pos 0 (top-left), pos 3 (top-right)
                // Row 1: pos 1 (mid-left), pos 4 (mid-right)
                // Row 2: pos 2 (bot-left), pos 5 (bot-right)
                const order = [0, 3, 1, 4, 2, 5];
                order.forEach(pos => {
                    const dot = document.createElement('div');
                    dot.className = 'dot ' + (dots[pos] ? 'raised' : 'flat');
                    charGrid.appendChild(dot);
                });

                cell.appendChild(charGrid);
                grid.appendChild(cell);
            });
        }

        function checkAnswer() {
            const answer = document.getElementById('answer').value.toLowerCase().trim();
            if (answer) {
                window.location.href = '7' + answer + '.html';
            }
        }

        document.getElementById('answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        createBrailleGrid();
    </script>
</body>
</html>
