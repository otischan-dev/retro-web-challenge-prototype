<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 4 - Web Puzzle Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e94560;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #e94560;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
            text-align: center;
        }

        .level-badge {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #e94560;
        }

        .puzzle-area {
            background: #1a1a2e;
            border: 1px solid #00fff5;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
        }

        .puzzle-text {
            color: #ffffff;
            font-size: 1.2em;
            line-height: 1.8;
        }

        .hint {
            color: #00fff5;
            margin-top: 20px;
            font-style: italic;
            font-size: 0.95em;
            display: none;
        }

        .hint-btn {
            display: none;
            padding: 10px 25px;
            margin-top: 20px;
            background: linear-gradient(45deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 5px;
            color: #1a1a2e;
            font-size: 0.9em;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .hint-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .timer-display {
            color: #666;
            font-size: 0.85em;
            margin-top: 15px;
            font-style: italic;
        }

        .input-area {
            margin-top: 30px;
        }

        .input-area label {
            display: block;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .url-display {
            background: #0a0a15;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            color: #888;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .url-display .editable {
            color: #00fff5;
            border-bottom: 2px dashed #00fff5;
        }

        input[type="text"] {
            width: 200px;
            padding: 12px;
            font-size: 1.1em;
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            border: 2px solid #00fff5;
            border-radius: 5px;
            color: #00fff5;
            text-align: center;
            outline: none;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(0, 255, 245, 0.5);
        }

        .go-btn {
            display: inline-block;
            padding: 12px 30px;
            margin-top: 15px;
            background: linear-gradient(45deg, #00fff5, #00b8b8);
            border: none;
            border-radius: 5px;
            color: #1a1a2e;
            font-size: 1em;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .go-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 245, 0.6);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #666;
            text-decoration: none;
            font-size: 0.9em;
        }

        .back-link:hover {
            color: #e94560;
        }

        .success-badge {
            background: #00ff88;
            color: #1a1a2e;
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 50px);
            grid-template-rows: repeat(7, 50px);
            margin: 30px auto;
            width: fit-content;
        }

        .cell {
            width: 50px;
            height: 50px;
            display: flex;
            border: 2px solid black;
            box-sizing: border-box;
        }

        .cell-full-white {
            background: white;
        }

        .cell-full-black {
            background: black;
        }

        .cell-half {
            display: flex;
        }

        .half-left {
            width: 50%;
            height: 100%;
        }

        .half-right {
            width: 50%;
            height: 100%;
        }

        .black-bg {
            background: black;
        }

        .white-bg {
            background: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-badge">✅ Level 3 Complete!</div>
        <span class="level-badge">LEVEL 4</span>
        <h1>🔲 The Grid</h1>
        
        <div class="puzzle-area">
            <p class="puzzle-text">
                Look at the grid below.<br>
                What do you see?
            </p>
            
            <div class="grid" id="puzzleGrid"></div>
            
            <button class="hint-btn" id="hintBtn" onclick="showHint()">💡 Show Hint</button>
            <p class="hint" id="hintText"></p>
        </div>

        <div class="input-area">
            <label>Enter the answer to proceed:</label>
            <div class="url-display">
                https://puzzles.otischan.dev/5<span class="editable">?????</span>.html
            </div>
            <input type="text" id="answer" placeholder="your answer" autocomplete="off">
            <br>
            <button class="go-btn" onclick="checkAnswer()">Go →</button>
        </div>

        <a href="3element.html" class="back-link">← Back to Level 3</a>
    </div>

    <script>
        const encryptedHint = "FBsXEh4aFQwDARYPDR4MDgYIFg0VBhkeDRMLAhkQDBoaBhQOAR4XBQwIEhwNGx0=";
        const key = 42;
        
        const grid_map = [
            ["W", "W", "BW", "W", "W", "BB"], 
            ["W", "W", "W", "W", "W", "W"],
            ["W", "W", "W", "W", "W", "W"],
            ["B", "W", "BW", "W", "W", "W"],
            ["W", "W", "W", "W", "W", "W"],
            ["W", "W", "W", "W", "W", "W"],
            ["W", "W", "BW", "BW", "BW", "BB"] 
        ];

        let startTime = Date.now();
        const waitTime = 5 * 60 * 1000; // 5 minutes in milliseconds

        function decryptHint(encrypted, key) {
            const decoded = atob(encrypted);
            let decrypted = '';
            for (let i = 0; i < decoded.length; i++) {
                decrypted += String.fromCharCode(decoded.charCodeAt(i) ^ key);
            }
            return decrypted;
        }

        function showHint() {
            const hintText = decryptHint(encryptedHint, key);
            document.getElementById('hintText').textContent = hintText;
            document.getElementById('hintText').style.display = 'block';
            document.getElementById('hintBtn').style.display = 'none';
        }

        function updateTimer() {
            const elapsed = Date.now() - startTime;
            const remaining = waitTime - elapsed;

            if (remaining <= 0) {
                document.getElementById('hintBtn').style.display = 'inline-block';
                document.getElementById('timerDisplay').style.display = 'none';
            } else {
                const minutes = Math.floor(remaining / 60000);
                const seconds = Math.floor((remaining % 60000) / 1000);
                document.getElementById('countdown').textContent = 
                    `${minutes}:${seconds.toString().padStart(2, '0')}`;
                setTimeout(updateTimer, 1000);
            }
        }

        function createGrid() {
            const gridElement = document.getElementById('puzzleGrid');
            
            grid_map.forEach(row => {
                row.forEach(cellType => {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (cellType === 'W') {
                        cell.classList.add('cell-full-white');
                    } else if (cellType === 'B') {
                        cell.classList.add('cell-full-black');
                    } else if (cellType === 'BW') {
                        cell.classList.add('cell-half');
                        const leftHalf = document.createElement('div');
                        leftHalf.className = 'half-left black-bg';
                        const rightHalf = document.createElement('div');
                        rightHalf.className = 'half-right white-bg';
                        cell.appendChild(leftHalf);
                        cell.appendChild(rightHalf);
                    } else if (cellType === 'BB') {
                        cell.classList.add('cell-full-black');
                    }
                    
                    gridElement.appendChild(cell);
                });
            });
        }

        function checkAnswer() {
            const answer = document.getElementById('answer').value.toLowerCase().trim();
            if (answer) {
                window.location.href = '5' + answer + '.html';
            }
        }

        document.getElementById('answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        // Initialize grid and timer on page load
        createGrid();
        updateTimer();
    </script>
</body>
</html>
